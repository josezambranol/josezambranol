<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="José Daniel Zambrano Luna - Desarrollador Backend Java y Fullstack">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="240" rx="16" fill="url(#grid)" />

  <!-- Decorative glow circles -->
  <circle cx="1050" cy="40" r="140" fill="#38bdf8" fill-opacity="0.12" />
  <circle cx="140" cy="210" r="110" fill="#6366f1" fill-opacity="0.14" />

  <!-- Subtle code motif on the right -->
  <g fill="#e0f2fe" fill-opacity="0.16" font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="930" y="75">@RestController</text>
    <text x="930" y="102">SpringBoot · Java 21</text>
    <text x="930" y="129">PostgreSQL · Docker</text>
    <text x="930" y="156">JWT · RBAC · CI/CD</text>
  </g>

  <!-- Accent bar -->
  <rect x="72" y="54" width="6" height="132" rx="3" fill="url(#accentGrad)" />

  <!-- Main Title -->
  <text x="98" y="104" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="0.5">
    José Daniel Zambrano Luna
  </text>

  <!-- Subtitle -->
  <text x="98" y="144" fill="#bae6fd" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600">
    Desarrollador Backend Java &amp; Fullstack
  </text>

  <!-- Tech pills line -->
  <text x="98" y="178" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="16">
    Spring Boot 3  ·  Spring Security 6  ·  PostgreSQL / MySQL  ·  Docker  ·  GitHub Actions
  </text>
</svg>
